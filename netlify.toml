[build]
  command = "npm run build"
  publish = "dist"

# Edge Functions — Pré-rendu SEO
# Ordre important : les fonctions spécifiques (guide/blog) tournent en premier,
# puis seo-prerender s'applique à toutes les autres routes statiques publiques.

# Sitemap dynamique — doit être AVANT blog/* pour intercepter /sitemap.xml
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/blog/*"
  function = "blog-prerender"

[[edge_functions]]
  path = "/omra-femme-seule"
  function = "guide-prerender"

[[edge_functions]]
  path = "/conditions-omra"
  function = "guide-prerender"

[[edge_functions]]
  path = "/quand-partir-omra"
  function = "guide-prerender"

[[edge_functions]]
  path = "/omra-tout-compris"
  function = "guide-prerender"

[[edge_functions]]
  path = "/meilleure-agence-omra"
  function = "guide-prerender"

[[edge_functions]]
  path = "/definition-omra"
  function = "guide-prerender"

[[edge_functions]]
  path = "/prix-omra-2026"
  function = "guide-prerender"

# Injection des meta SEO (title/description/canonical/OG/Twitter) pour toutes
# les pages statiques publiques. Résout le souci de canonique vu par Googlebot.
[[edge_functions]]
  path = "/*"
  function = "seo-prerender"
