<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Content Security Policy - Protection contre XSS -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https: http:;
      connect-src 'self' https://lptyhenryzhztdwpkvsc.supabase.co https://www.google-analytics.com https://analytics.google.com wss://lptyhenryzhztdwpkvsc.supabase.co;
      frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    ">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Performance optimizations -->
    <link rel="dns-prefetch" href="//lptyhenryzhztdwpkvsc.supabase.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload WOFF2 fonts with font-display swap -->
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/inter/v18/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIa2JL7W0Q5n-wU.woff2" crossorigin>
    
    <!-- Favicons pour différents navigateurs et appareils -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Favicon supplémentaires pour une meilleure compatibilité -->
    <meta name="msapplication-TileImage" content="/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Preload critical LCP hero image ONLY for desktop (mobile uses gradient) -->
    <link rel="preload" as="image" href="/hero-kaaba-avif.jpg" fetchpriority="high" media="(min-width: 768px)">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Critical CSS inline - Minimized for mobile performance -->
    <style>
      *,::before,::after{box-sizing:border-box;margin:0;padding:0}
      html{line-height:1.5;font-family:system-ui,sans-serif;-webkit-text-size-adjust:100%}
      body{background:#0B1E3A;margin:0}
      .gradient-text-secondary{background:linear-gradient(135deg,#f59e0b,#fcd34d);-webkit-background-clip:text;color:transparent}
      .relative{position:relative}.absolute{position:absolute}.inset-0{inset:0}
      .flex{display:flex}.hidden{display:none}.min-h-screen{min-height:100vh}
      .text-white{color:#fff}.w-full{width:100%}
      .text-4xl{font-size:2.25rem}.text-6xl{font-size:3.75rem}
      .font-bold{font-weight:700}
      @media (min-width:768px){.md\:text-8xl{font-size:6rem}.md\:text-9xl{font-size:8rem}.md\:block{display:block}}
    </style>
    
    <!-- Preload Inter font ONLY weight 400/700 for mobile -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <title>Omra Bons Plans</title>
    <!-- Meta description gérée dynamiquement par react-helmet-async dans chaque page -->
    <meta name="author" content="Omra Bons Plans" />

    <meta property="og:title" content="Omra Bons Plans – Voyages religieux Hajj & Omra" />
    <meta property="og:description" content="Omra Bons Plans est la plateforme de référence pour trouver des logements, chauffeurs, guides et séjours pour le Hajj & la Omra." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://omrabonsplans.fr/favicon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Omra Bons Plans – Voyages religieux Hajj & Omra" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@omrabonsplans" />
    <meta name="twitter:image" content="https://omrabonsplans.fr/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
