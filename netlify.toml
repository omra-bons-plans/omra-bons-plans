# ─── HTTP Cache Headers ────────────────────────────────────────────────────────
# JS/CSS assets — content-hashed filenames → immutable cache (1 year)
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images in /assets (also content-hashed)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Lovable-uploads images — long cache (30 days), not immutable (can change)
[[headers]]
  for = "/lovable-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Static images at root level
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — never cache (always fresh)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Edge Functions — Pré-rendu SEO
# Ordre important : les fonctions spécifiques (guide/blog) tournent en premier,
# puis seo-prerender s'applique à toutes les autres routes statiques publiques.

# Sitemap dynamique — doit être AVANT blog/* pour intercepter /sitemap.xml
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

# /blog/[category] doit être AVANT /blog/* pour intercepter les pages de liste
[[edge_functions]]
  path = "/blog/general"
  function = "blog-category-prerender"

[[edge_functions]]
  path = "/blog/restaurants"
  function = "blog-category-prerender"

[[edge_functions]]
  path = "/blog/associations"
  function = "blog-category-prerender"

[[edge_functions]]
  path = "/blog/vendeurs"
  function = "blog-category-prerender"

[[edge_functions]]
  path = "/blog/*"
  function = "blog-prerender"

