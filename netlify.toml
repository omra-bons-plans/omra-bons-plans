[build]
  command = "npm run build"
  publish = "dist"

# Redirect www → non-www (fix "Page en double sans canonical" in GSC)
[[redirects]]
  from = "https://www.omrabonsplans.fr/*"
  to = "https://omrabonsplans.fr/:splat"
  status = 301
  force = true

# Redirects agences — anciennes URLs avec %20 → nouvelles URLs avec tirets
