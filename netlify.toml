[build]
  command = "npm run build"
  publish = "dist"

# Edge Function — Dynamic rendering pour les bots (Googlebot, etc.)
# Les bots reçoivent du HTML pré-rendu avec le vrai contenu Supabase.
# Les utilisateurs normaux voient le React SPA habituel.
[[edge_functions]]
  path = "/blog/*"
  function = "blog-prerender"
