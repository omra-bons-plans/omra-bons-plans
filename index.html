        if(h)h.classList.add('hidden');
        if(s)s.style.display='none';
      };

    <!-- ⚡ Analytics: Différé après interaction utilisateur -->
    <script>
      (function(){
        var done=false;
        function go(){
          if(done)return;done=true;
          requestIdleCallback?requestIdleCallback(load):setTimeout(load,100);
        }
        function load(){
          var g=document.createElement('script');
          g.src='https://www.googletagmanager.com/gtag/js?id=G-Q2NQD2NW1V';
          g.async=true;
          document.head.appendChild(g);
          g.onload=function(){
            window.dataLayer=window.dataLayer||[];
            function gtag(){dataLayer.push(arguments)}
            gtag('js',new Date());gtag('config','G-Q2NQD2NW1V');
          };
        }
        ['scroll','click','touchstart'].forEach(function(e){
          window.addEventListener(e,go,{once:true,passive:true});
        });
        setTimeout(go,6000);
      })();
    </script>
