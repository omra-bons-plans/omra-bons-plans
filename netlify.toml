[build]
  command = "npm run build"
  publish = "dist"

# Redirect www → non-www (fix "Page en double sans canonical" in GSC)
[[redirects]]
  from = "https://www.omrabonsplans.fr/*"
  to = "https://omrabonsplans.fr/:splat"
  status = 301
  force = true

# Edge Function — Dynamic rendering pour les bots (Googlebot, etc.)
[[edge_functions]]
  path = "/blog/*"
  function = "blog-prerender"

[[edge_functions]]
  path = "/omra-femme-seule"
  function = "guide-prerender"

