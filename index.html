<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Content Security Policy - Protection contre XSS -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https: http:;
      connect-src 'self' https://lptyhenryzhztdwpkvsc.supabase.co https://www.google-analytics.com https://analytics.google.com wss://lptyhenryzhztdwpkvsc.supabase.co;
      frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    ">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Performance optimizations -->
    <link rel="dns-prefetch" href="//lptyhenryzhztdwpkvsc.supabase.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    
    <!-- Preload critical LCP hero image AVIF -->
    <link rel="preload" as="image" href="/hero-kaaba-2025-optimized.avif" type="image/avif" fetchpriority="high">
    
    <!-- Favicons pour différents navigateurs et appareils -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Favicon supplémentaires pour une meilleure compatibilité -->
    <meta name="msapplication-TileImage" content="/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Mobile viewport optimisé - pas de zoom initial -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    
    <!-- Critical CSS inline - Optimized for instant LCP render (<500ms delay) -->
    <style>
      *,::before,::after{box-sizing:border-box;margin:0;padding:0}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
      body{margin:0;background:#f5f5f0}
      
      /* Hero ratio intrinsèque - Aucun calcul JS/police requis */
      .hero-wrapper{position:relative;margin:0 auto;max-width:100%;overflow:hidden;min-height:100vh}
      .hero-media{position:absolute;inset:0;width:100%;height:100%}
      .hero-media>img{display:block;width:100%;height:100%;object-fit:cover}
      
      /* Overlay non bloquant - police système */
      .hero-overlay{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,0,0,.5) 0,rgba(0,0,0,.4) 50%,rgba(0,0,0,.6) 100%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;z-index:1}
      
      /* Mobile: zero gap entre navbar et hero + optimisations CLS */
      @media (max-width:767px){
        .hero-wrapper{margin-top:0!important;padding-top:0!important;min-height:100vh}
        .hero-media{min-height:100vh}
        header,nav,.navbar{margin-bottom:0!important;height:auto}
        header::after,nav::after,.navbar::after{content:none!important}
        body{overflow-x:hidden}
      }
      
      .gradient-text-secondary{background:linear-gradient(135deg,#f59e0b 0,#fbbf24 50%,#fcd34d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
      .container{width:100%;max-width:1280px;margin:0 auto;padding:0 1.5rem}
      .relative{position:relative}.absolute{position:absolute}.flex{display:flex}.hidden{display:none}
      .items-center{align-items:center}.text-white{color:#fff}.w-full{width:100%}
      .text-4xl{font-size:2.25rem}.text-6xl{font-size:3.75rem}
      .font-bold{font-weight:700}.font-black{font-weight:900}
      .z-10{z-index:10}.z-20{z-index:20}
      @media(min-width:768px){.md\:text-8xl{font-size:6rem}}
    </style>
    
    <title>Omra Bons Plans</title>
    <!-- Meta description gérée dynamiquement par react-helmet-async dans chaque page -->
    <meta name="author" content="Omra Bons Plans" />

    <meta property="og:title" content="Omra Bons Plans – Voyages religieux Hajj & Omra" />
    <meta property="og:description" content="Omra Bons Plans est la plateforme de référence pour trouver des logements, chauffeurs, guides et séjours pour le Hajj & la Omra." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://omrabonsplans.fr/favicon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Omra Bons Plans – Voyages religieux Hajj & Omra" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@omrabonsplans" />
    <meta name="twitter:image" content="https://omrabonsplans.fr/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Webfonts chargées après first render (idle callback) -->
    <script>
      (window.requestIdleCallback||function(f){setTimeout(f,1500)})(function(){
        var p=document.createElement('link');p.rel='preconnect';p.href='https://fonts.gstatic.com';p.crossOrigin='';
        var f=document.createElement('link');f.rel='stylesheet';f.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap';
        document.head.append(p,f);
      });
    </script>
    
    <!-- Defer non-critical scripts (Analytics, widgets) - Load after 3.5s -->
    <script>
      window.addEventListener('load',function(){
        setTimeout(function(){
          ['https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXX'].forEach(function(u){
            var s=document.createElement('script');s.src=u;s.async=true;s.defer=true;document.head.appendChild(s);
          });
        },3500);
      });
    </script>
  </body>
</html>
