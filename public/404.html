<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée - 404 | Omra Bons Plans</title>
    <meta name="description" content="La page que vous recherchez n'existe pas. Retournez à l'accueil d'Omra Bons Plans.">
    <meta name="robots" content="noindex, follow">
    <!-- Meta tags pour signaler aux crawlers qu'il s'agit d'une erreur 404 -->
    <meta name="prerender-status-code" content="404">
    <meta http-equiv="status" content="404 Not Found">
    <link rel="canonical" href="https://omrabonsplans.fr/404">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        h1 {
            font-size: 4rem;
            color: #3b82f6;
            margin: 0;
        }
        h2 {
            font-size: 1.5rem;
            color: #1f2937;
            margin: 1rem 0;
        }
        p {
            color: #6b7280;
            margin: 1rem 0;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 0.5rem;
            margin: 1rem 0;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #2563eb;
        }
    </style>
    <script>
        // Redirection vers l'app React après 3 secondes
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
    </script>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page non trouvée</h2>
        <p>La page que vous recherchez n'existe pas ou a été déplacée.</p>
        <p>Vous allez être redirigé vers l'accueil dans 3 secondes...</p>
        <a href="/" class="btn">Retour immédiat à l'accueil</a>
    </div>
</body>
</html>
