<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Content Security Policy - Protection contre XSS -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https: http:;
      connect-src 'self' https://lptyhenryzhztdwpkvsc.supabase.co https://www.google-analytics.com https://analytics.google.com wss://lptyhenryzhztdwpkvsc.supabase.co;
      frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    ">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Performance optimizations -->
    <link rel="dns-prefetch" href="//lptyhenryzhztdwpkvsc.supabase.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload WOFF2 fonts with font-display swap -->
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/inter/v18/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIa2JL7W0Q5n-wU.woff2" crossorigin>
    
    <!-- Favicons pour différents navigateurs et appareils -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Favicon supplémentaires pour une meilleure compatibilité -->
    <meta name="msapplication-TileImage" content="/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Preload critical LCP hero image AVIF with high priority -->
    <link rel="preload" as="image" href="/hero-kaaba-avif.jpg" fetchpriority="high" imagesrcset="/hero-kaaba-avif.jpg 1400w" imagesizes="100vw" media="(min-width: 768px)" type="image/avif">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Critical CSS inline for fastest FCP/LCP -->
    <style>
      /* Critical CSS for above-the-fold content */
      *,::before,::after{box-sizing:border-box;border:0 solid #e5e7eb;margin:0;padding:0}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
      body{margin:0;line-height:inherit;background:#0B1E3A}
      .hero-overlay{background:linear-gradient(135deg,rgba(11,30,58,.95) 0,rgba(4,18,36,.85) 100%)}
      .gradient-text-secondary{background:linear-gradient(135deg,#f59e0b 0,#fbbf24 50%,#fcd34d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
      .container{width:100%;max-width:1280px;margin:0 auto;padding:0 1rem}
      .relative{position:relative}.absolute{position:absolute}.inset-0{inset:0}
      .flex{display:flex}.hidden{display:none}.min-h-screen{min-height:100vh}
      .items-center{align-items:center}.justify-center{justify-content:center}
      .object-cover{object-fit:cover}.text-center{text-align:center}
      .text-white{color:#fff}.w-full{width:100%}.h-full{height:100%}
      .text-4xl{font-size:2.25rem;line-height:2.5rem}.text-6xl{font-size:3.75rem;line-height:1}
      .font-bold{font-weight:700}.font-black{font-weight:900}
      .overflow-hidden{overflow:hidden}.z-10{z-index:10}
      img{display:block;max-width:100%;height:auto}
      @media (min-width:768px){.md\:text-8xl{font-size:6rem;line-height:1}.md\:text-9xl{font-size:8rem;line-height:1}.md\:block{display:block}.md\:hidden{display:none}}
    </style>
    
    <title>Omra Bons Plans</title>
    <!-- Meta description gérée dynamiquement par react-helmet-async dans chaque page -->
    <meta name="author" content="Omra Bons Plans" />

    <meta property="og:title" content="Omra Bons Plans – Voyages religieux Hajj & Omra" />
    <meta property="og:description" content="Omra Bons Plans est la plateforme de référence pour trouver des logements, chauffeurs, guides et séjours pour le Hajj & la Omra." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://omrabonsplans.fr/favicon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Omra Bons Plans – Voyages religieux Hajj & Omra" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@omrabonsplans" />
    <meta name="twitter:image" content="https://omrabonsplans.fr/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
