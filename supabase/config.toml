# Scheduled functions to update weather and exchange rates
[[edge_runtime.scheduled_functions]]
name = "update-weather-data"
# Run every hour
schedule = "0 * * * *"

[[edge_runtime.scheduled_functions]]
name = "update-exchange-rates"
# Run every 12 hours at midnight and noon
schedule = "0 0,12 * * *"

# Omra scraper - runs every Monday at 06:00 Europe/Paris
[[edge_runtime.scheduled_functions]]
name = "omra-scraper"
# Run every Monday at 06:00 Europe/Paris (05:00 UTC in winter, 04:00 UTC in summer)
schedule = "0 5 * * 1"