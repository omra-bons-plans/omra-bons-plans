      // ⚡ MOBILE: Retarder GA au maximum pour réduire TBT

      const loadGA = () => {

          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-6T49BWNBV9';
          document.head.appendChild(script);
        }
      };
      
      // Sur mobile: charger uniquement après idle + interaction
      const isMobile = window.innerWidth < 768;
      if (isMobile) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(() => {
            ['scroll', 'click', 'touchstart'].forEach(event => {
              window.addEventListener(event, loadGA, { once: true, passive: true });
            });
            setTimeout(loadGA, 15000);
          }, { timeout: 10000 });
        } else {
          setTimeout(loadGA, 15000);
        }
      } else {
        // Desktop: charger normalement après interaction ou 5s

        });
        setTimeout(loadGA, 5000);
